name: Publish SMART24 Vigilante APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-smart24-v3.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-tested-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TESTED_RUN_ID: '37058313716'
      TESTED_COMMIT: 'a3006da15c5ed6677c3295db4397947b191422d5'
      ARTIFACT_ID: '11249326756'
      RELEASE_TAG: 'v3.2.0-vigilante-celular'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirmar código e artefato aprovados
        run: |
          RESULT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN_ID" --jq '.conclusion + " " + .head_sha')
          test "$RESULT" = "success $TESTED_COMMIT"
          git diff --exit-code "$TESTED_COMMIT" "$GITHUB_SHA" -- android-vision-pilot .github/workflows/build-smart24-vision.yml
          ARTIFACT_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')
          test "$ARTIFACT_RUN" = "$TESTED_RUN_ID"
      - name: Baixar e conferir o ZIP do Actions
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > tested-apk.zip
          echo 'eebde13be271886b189cc895ae500570a62e20e2b1dcb13a8c399ccb15cf801e  tested-apk.zip' | sha256sum -c -
          mkdir tested-apk
          unzip -q tested-apk.zip app-debug.apk -d tested-apk
          mv tested-apk/app-debug.apk tested-apk/SMART24-Vigilante-Celular-v3.2.apk
      - name: Conferir versão, assinatura e hash do APK
        run: |
          APK_FILE=tested-apk/SMART24-Vigilante-Celular-v3.2.apk
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER_BIN"
          test -n "$AAPT_BIN"
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_FILE"
          APK_PACKAGE=$("$AAPT_BIN" dump badging "$APK_FILE" | head -n 1)
          echo "$APK_PACKAGE"
          echo "$APK_PACKAGE" | grep -F "name='br.com.thiaguinhosolucoes.smart24vision'"
          echo "$APK_PACKAGE" | grep -F "versionCode='9'"
          echo "$APK_PACKAGE" | grep -F "versionName='3.2.0-mobile-vigilante'"
          APK_SHA=$(sha256sum "$APK_FILE" | cut -d ' ' -f1)
          echo "$APK_SHA  SMART24-Vigilante-Celular-v3.2.apk" > tested-apk/SHA256SUMS.txt
          cat tested-apk/SHA256SUMS.txt
      - name: Publicar download direto
        run: |
          gh release create "$RELEASE_TAG" tested-apk/SMART24-Vigilante-Celular-v3.2.apk tested-apk/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'SMART24 Vigilante Celular 3.2.0 — autenticação RTSP na mesma conexão' \
            --notes-file docs/VALIDACAO-VIGILANTE-V3_2.md \
            --prerelease
