name: Publish SMART24 Vigilante APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-smart24-v3.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-tested-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TESTED_RUN_ID: '37058313716'
      TESTED_COMMIT: 'a3006da15c5ed6677c3295db4397947b191422d5'
      ARTIFACT_ID: '11249326756'
      RELEASE_TAG: 'v3.2.0-vigilante-celular'
      INSTALLATION_RUN_ID: '37078546881'
      INSTALLATION_COMMIT: '774772bc7bbea4d95aacd9b768744d4e2d9ceb5c'
      EXPECTED_APK_SHA256: 'a8359d87933d959e64d6a87d229f5e18276cb3e8b6df65790ef350c5fdd33de1'
      EXPECTED_SIGNING_SHA256: '65a8783f17b9196344ded1785b4c8e53e6e9c2ab19908a86663bee0a572ace01'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirmar código e artefato aprovados
        run: |
          RESULT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN_ID" --jq '.conclusion + " " + .head_sha')
          test "$RESULT" = "success $TESTED_COMMIT"
          git diff --exit-code "$TESTED_COMMIT" "$GITHUB_SHA" -- android-vision-pilot .github/workflows/build-smart24-vision.yml ':(exclude)android-vision-pilot/scripts/verify-published-apk.py'
          ARTIFACT_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')
          test "$ARTIFACT_RUN" = "$TESTED_RUN_ID"
      - name: Exigir instalação aprovada do APK exato publicado
        run: |
          RESULT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INSTALLATION_RUN_ID" --jq '.conclusion + " " + .head_sha')
          test "$RESULT" = "success $INSTALLATION_COMMIT"
          git diff --exit-code "$INSTALLATION_COMMIT" "$GITHUB_SHA" -- .github/workflows/verify-published-smart24-apk.yml android-vision-pilot/scripts/verify-published-apk.py
          gh run download "$INSTALLATION_RUN_ID" --pattern 'SMART24-Published-APK-Install-API-*' --dir installed-apk-proof
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          proofs = [json.loads(p.read_text()) for p in Path('installed-apk-proof').rglob('installation.json')]
          assert len(proofs) == 2 and {p['android_api'] for p in proofs} == {26, 35}
          for proof in proofs:
              assert proof['released_apk_sha256'] == os.environ['EXPECTED_APK_SHA256']
              assert proof['package'] == 'br.com.thiaguinhosolucoes.smart24vision'
              assert proof['fresh_install'] == proof['same_certificate_update'] == 'Success'
              assert proof['legacy_update'] == 'INSTALL_FAILED_UPDATE_INCOMPATIBLE'
              assert len(proof['cold_launches']) == 2
              assert all(p['launch_status'] == 'ok' and p['process_running'] and not p['app_crash'] for p in proof['cold_launches'])
          print('Instalação do arquivo publicado aprovada em Android 8 e Android 15.')
          PY
      - name: Baixar e conferir o ZIP do Actions
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > tested-apk.zip
          echo 'eebde13be271886b189cc895ae500570a62e20e2b1dcb13a8c399ccb15cf801e  tested-apk.zip' | sha256sum -c -
          mkdir tested-apk
          unzip -q tested-apk.zip app-debug.apk -d tested-apk
          mv tested-apk/app-debug.apk tested-apk/SMART24-Vigilante-Celular-v3.2.apk
      - name: Conferir versão, assinatura e hash do APK
        run: |
          APK_FILE=tested-apk/SMART24-Vigilante-Celular-v3.2.apk
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER_BIN"
          test -n "$AAPT_BIN"
          set -o pipefail
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_FILE" | tee tested-apk/signature.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          certs = re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F:]+)', Path('tested-apk/signature.txt').read_text())
          if len(certs) != 1 or certs[0].replace(':', '').lower() != os.environ['EXPECTED_SIGNING_SHA256']:
              raise SystemExit('Publicação bloqueada: assinatura incompatível. Configure a chave persistente antes de distribuir outro build.')
          PY
          APK_PACKAGE=$("$AAPT_BIN" dump badging "$APK_FILE" | head -n 1)
          echo "$APK_PACKAGE"
          echo "$APK_PACKAGE" | grep -F "name='br.com.thiaguinhosolucoes.smart24vision'"
          echo "$APK_PACKAGE" | grep -F "versionCode='9'"
          echo "$APK_PACKAGE" | grep -F "versionName='3.2.0-mobile-vigilante'"
          APK_SHA=$(sha256sum "$APK_FILE" | cut -d ' ' -f1)
          test "$APK_SHA" = "$EXPECTED_APK_SHA256"
          echo "$APK_SHA  SMART24-Vigilante-Celular-v3.2.apk" > tested-apk/SHA256SUMS.txt
          cat tested-apk/SHA256SUMS.txt
      - name: Publicar download direto
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            PUBLISHED_DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "SMART24-Vigilante-Celular-v3.2.apk") | .digest')
            test "$PUBLISHED_DIGEST" = "sha256:$EXPECTED_APK_SHA256"
            gh release edit "$RELEASE_TAG" --notes-file docs/VALIDACAO-VIGILANTE-V3_2.md
          else
            gh release create "$RELEASE_TAG" tested-apk/SMART24-Vigilante-Celular-v3.2.apk tested-apk/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title 'SMART24 Vigilante Celular 3.2.0 — autenticação RTSP na mesma conexão' \
              --notes-file docs/VALIDACAO-VIGILANTE-V3_2.md \
              --prerelease
          fi
