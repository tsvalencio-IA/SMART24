name: P2P ARM64 Lab

on:
  push:
    branches:
      - p2p-iotvideo-arm64-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-build:
    runs-on: ubuntu-latest
    env:
      GWELL_NEXUS_USER: ${{ secrets.GWELL_NEXUS_USER }}
      GWELL_NEXUS_PASSWORD: ${{ secrets.GWELL_NEXUS_PASSWORD }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Probe modern Gwell public artifact endpoints
        run: |
          set +e
          for URL in \
            "https://mvn.zztfly.com/android/com/gwell/gwiotapi/1.6.7.3/gwiotapi-1.6.7.3.pom" \
            "https://nexus-sg.gwell.cc/nexus/repository/maven-releases/com/gwell/gwiotapi/1.6.7.3/gwiotapi-1.6.7.3.pom" \
            "https://nexus-sg.gwell.cc/nexus/repository/maven-gwiot/com/gwell/gwiotapi/1.6.7.3/gwiotapi-1.6.7.3.pom"
          do
            CODE=$(curl -L -sS -o /tmp/probe.out -w "%{http_code}" "$URL")
            echo "$CODE $URL"
          done
          exit 0
      - name: Resolve Gwell and compile
        run: |
          gradle -p android-vision-pilot :app:dependencies --configuration debugRuntimeClasspath --console=plain
          gradle -p android-vision-pilot :app:assembleDebug --stacktrace --console=plain
      - name: Inspect modern Gwell API and native ABIs
        run: |
          set -e
          AAR=$(find ~/.gradle/caches -type f -name 'gwiotapi-1.6.7.3.aar' | head -n1)
          echo "GWIOT_AAR=$AAR"
          test -n "$AAR"
          rm -rf /tmp/gwiot && mkdir -p /tmp/gwiot
          unzip -q "$AAR" -d /tmp/gwiot
          echo "=== GWIOT AAR CONTENTS ==="
          find /tmp/gwiot -maxdepth 4 -type f | sort | sed -n '1,220p'
          echo "=== GWIoT SIGNATURES ==="
          javap -classpath /tmp/gwiot/classes.jar -public com.gw.gwiotapi.GWIoT 2>/dev/null || true
          echo "=== ENTITY SIGNATURES ==="
          for C in com.gw.gwiotapi.entities.InitOptions com.gw.gwiotapi.entities.UserC2CInfo com.gw.gwiotapi.entities.Device com.gw.gwiotapi.entities.LivePlayerOption com.gw.gwiotapi.entities.OpenPluginOption; do
            echo "--- $C ---"
            javap -classpath /tmp/gwiot/classes.jar -public "$C" 2>/dev/null || true
          done
          echo "=== NATIVE ABI FILES IN GWIOT AAR ==="
          find /tmp/gwiot -type f -path '*/jni/*' -o -path '*/lib/*' | sort || true
