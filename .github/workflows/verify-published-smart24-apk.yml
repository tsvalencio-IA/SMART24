name: Verify published SMART24 APK installation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-published-smart24-apk.yml'
      - 'android-vision-pilot/scripts/verify-published-apk.py'

permissions:
  contents: read

jobs:
  install-published-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixar os APKs públicos completos
        run: |
          mkdir -p published-apk
          curl --fail --location --retry 3 --output published-apk/v3.1.apk https://github.com/tsvalencio-IA/SMART24/releases/download/v3.1.0-vigilante-celular/SMART24-Vigilante-Celular-v3.1.apk
          curl --fail --location --retry 3 --output published-apk/v3.2.apk https://github.com/tsvalencio-IA/SMART24/releases/download/v3.2.0-vigilante-celular/SMART24-Vigilante-Celular-v3.2.apk
          python3 android-vision-pilot/scripts/verify-published-apk.py prepare
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar o arquivo publicado e reproduzir o conflito de atualização
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 android-vision-pilot/scripts/verify-published-apk.py install
      - name: Publicar evidências da instalação exata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-Published-APK-Install-API-${{ matrix.api }}
          path: published-apk/reports/
          if-no-files-found: error
