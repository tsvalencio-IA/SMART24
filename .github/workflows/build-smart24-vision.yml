name: Build SMART24 Vigilante Celular APK
# Revalidação após configuração da assinatura permanente do SMART24.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-vision-pilot/**'
      - '.github/workflows/build-smart24-vision.yml'

concurrency:
  group: smart24-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar, testar e verificar Android
        run: gradle -p android-vision-pilot :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain
      - name: Bloquear pipeline ML Kit que crasha no Android 16
        run: |
          APK="android-vision-pilot/app/build/outputs/apk/debug/app-debug.apk"
          if unzip -l "$APK" | grep -q 'libmlkitcommonpipeline.so'; then
            echo "ERRO: libmlkitcommonpipeline.so voltou ao APK."
            exit 1
          fi
          echo "OK: APK sem libmlkitcommonpipeline.so."
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-Vigilante-Celular-V3-APK
          path: android-vision-pilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar relatórios de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-V3-Validacao
          path: |
            android-vision-pilot/app/build/reports/tests/testDebugUnitTest/
            android-vision-pilot/app/build/test-results/testDebugUnitTest/
            android-vision-pilot/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparar servidor RTSP de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://github.com/bluenviron/mediamtx/releases/download/v1.12.2/mediamtx_v1.12.2_linux_amd64.tar.gz -o /tmp/mediamtx.tar.gz
          curl -fsSL https://github.com/bluenviron/mediamtx/releases/download/v1.12.2/mediamtx_v1.12.2_linux_amd64.tar.gz.sha256sum -o /tmp/mediamtx.sha256
          cd /tmp
          EXPECTED=$(cut -d ' ' -f1 mediamtx.sha256)
          ACTUAL=$(sha256sum mediamtx.tar.gz | cut -d ' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          tar -xzf mediamtx.tar.gz mediamtx mediamtx.yml
          ./mediamtx mediamtx.yml > /tmp/smart24-rtsp-server.log 2>&1 &
          sleep 2
          ffmpeg -nostdin -re -f lavfi -i 'testsrc2=size=640x360:rate=10' -c:v libx264 -preset ultrafast -tune zerolatency -g 10 -pix_fmt yuv420p -rtsp_transport tcp -f rtsp rtsp://127.0.0.1:8554/testcam > /tmp/smart24-rtsp-source.log 2>&1 &
          sleep 2
      - name: Preparar câmeras com autenticação e falha de rede
        run: |
          python3 android-vision-pilot/scripts/camera-fixtures.py > /tmp/smart24-camera-fixtures.log 2>&1 &
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(10):
              try:
                  with urlopen('http://127.0.0.1:8080/stats', timeout=2) as response:
                      assert response.status == 200
                  break
              except Exception:
                  if attempt == 9:
                      raise
                  time.sleep(1)
          PY
      - name: Instalar e abrir o APK no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle -p android-vision-pilot :app:connectedDebugAndroidTest --stacktrace --console=plain
            if adb shell test -d /sdcard/Android/data/br.com.thiaguinhosolucoes.smart24vision/files/proof; then adb pull /sdcard/Android/data/br.com.thiaguinhosolucoes.smart24vision/files/proof /tmp/smart24-ui-proof; else echo "Testes Android aprovados; diretório opcional de capturas não foi criado neste ambiente."; fi

      - name: Registrar respostas das câmeras de teste
        if: always()
        run: curl -fsS http://127.0.0.1:8080/stats -o /tmp/smart24-camera-fixtures-stats.json || true
      - name: Publicar relatório do teste Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-V3-Android-Smoke-API-${{ matrix.api }}
          path: |
            android-vision-pilot/app/build/reports/androidTests/
            android-vision-pilot/app/build/outputs/androidTest-results/
            /tmp/smart24-rtsp-server.log
            /tmp/smart24-rtsp-source.log
            /tmp/smart24-camera-fixtures.log
            /tmp/smart24-camera-fixtures-stats.json
            /tmp/smart24-ui-proof/
          if-no-files-found: ignore


  publish-signed:
    needs: [build, android-smoke]
    if: ${{ needs.build.result == 'success' && needs.android-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMART24_KEYSTORE_B64: ${{ secrets.SMART24_KEYSTORE_B64 }}
      SMART24_KEYSTORE_PASSWORD: ${{ secrets.SMART24_KEYSTORE_PASSWORD }}
      EXPECTED_CERT_SHA256: "7B2B93AFB05B660423AC1DC29E34905F5E2A2BE77ED226BCA9BE112605387E0D"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verificar assinatura permanente
        id: signing
        shell: bash
        run: |
          if [ -n "$SMART24_KEYSTORE_B64" ] && [ -n "$SMART24_KEYSTORE_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Assinatura permanente ainda não configurada. Adicione SMART24_KEYSTORE_B64 e SMART24_KEYSTORE_PASSWORD nos Actions secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Baixar repositório
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        if: steps.signing.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restaurar chave definitiva e gerar APK release
        if: steps.signing.outputs.ready == 'true'
        env:
          SMART24_KEYSTORE_PATH: ${{ runner.temp }}/smart24-release.jks
        run: |
          printf '%s' "$SMART24_KEYSTORE_B64" | base64 --decode > "$SMART24_KEYSTORE_PATH"
          gradle -p android-vision-pilot :app:assembleRelease --stacktrace --console=plain
          APK="android-vision-pilot/app/build/outputs/apk/release/app-release.apk"
          if unzip -l "$APK" | grep -q 'libmlkitcommonpipeline.so'; then
            echo "ERRO: release contém libmlkitcommonpipeline.so."
            exit 1
          fi

      - name: Validar assinatura, versão e decidir publicação
        if: steps.signing.outputs.ready == 'true'
        id: release
        env:
          SMART24_KEYSTORE_PATH: ${{ runner.temp }}/smart24-release.jks
        run: |
          APK="android-vision-pilot/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test "$CERT" = "$EXPECTED_CERT_SHA256"

          PACKAGE=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$PACKAGE"
          echo "$PACKAGE" | grep -F "name='br.com.thiaguinhosolucoes.smart24vision'"
          VERSION_CODE=$(printf '%s\n' "$PACKAGE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          VERSION_NAME=$(printf '%s\n' "$PACKAGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"

          CURRENT_CODE=$(python3 - <<'PY'
          import json
          print(json.load(open('smart24-update.json', encoding='utf-8'))['versionCode'])
          PY
          )
          if [ "$VERSION_CODE" -le "$CURRENT_CODE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Versão $VERSION_CODE já está no canal de atualização; nenhuma nova release será criada." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          APK_SHA=$(sha256sum "$APK" | cut -d ' ' -f1)
          TAG="v${VERSION_NAME}-code${VERSION_CODE}"
          APK_NAME="SMART24-Vigilante-Celular-${VERSION_NAME}.apk"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar APK assinado como artefato de teste
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-Signed-${{ github.ref_name }}-${{ github.run_number }}
          path: android-vision-pilot/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar APK assinado
        if: steps.signing.outputs.ready == 'true' && steps.release.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: |
          APK="android-vision-pilot/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "${{ runner.temp }}/${{ steps.release.outputs.apk_name }}"
          cat > "${{ runner.temp }}/release-notes.md" <<EOF
          SMART24 ${{ steps.release.outputs.version_name }}

          APK assinado com a chave permanente do SMART24.
          versionCode: ${{ steps.release.outputs.version_code }}
          SHA-256: ${{ steps.release.outputs.apk_sha }}
          Certificado SHA-256: $EXPECTED_CERT_SHA256

          Esta é a base para atualizações futuras sem desinstalar o aplicativo.
          EOF
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release já existe; mantendo publicação existente."
          else
            gh release create "${{ steps.release.outputs.tag }}" \
              "${{ runner.temp }}/${{ steps.release.outputs.apk_name }}" \
              --target "$GITHUB_SHA" \
              --title "SMART24 ${{ steps.release.outputs.version_name }}" \
              --notes-file "${{ runner.temp }}/release-notes.md"
          fi

      - name: Atualizar canal automático
        if: steps.signing.outputs.ready == 'true' && steps.release.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: |
          REMOTE_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "main avançou durante o build; release publicada, mas o manifesto automático não será sobrescrito por um commit antigo." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.release.outputs.tag }}/${{ steps.release.outputs.apk_name }}"
          cat > smart24-update.json <<EOF
          {
            "enabled": true,
            "versionCode": ${{ steps.release.outputs.version_code }},
            "versionName": "${{ steps.release.outputs.version_name }}",
            "apkUrl": "$URL",
            "sha256": "${{ steps.release.outputs.apk_sha }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart24-update.json
          git commit -m "Publish SMART24 ${{ steps.release.outputs.version_name }} update channel [skip ci]"
          git push origin HEAD:main
