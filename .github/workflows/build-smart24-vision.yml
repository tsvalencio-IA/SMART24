name: Build SMART24 Vigilante Celular APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-vision-pilot/**'
      - '.github/workflows/build-smart24-vision.yml'

concurrency:
  group: smart24-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar, testar e verificar Android
        run: gradle -p android-vision-pilot :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-Vigilante-Celular-V3-APK
          path: android-vision-pilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar relatórios de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-V3-Validacao
          path: |
            android-vision-pilot/app/build/reports/tests/testDebugUnitTest/
            android-vision-pilot/app/build/test-results/testDebugUnitTest/
            android-vision-pilot/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparar servidor RTSP de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://github.com/bluenviron/mediamtx/releases/download/v1.12.2/mediamtx_v1.12.2_linux_amd64.tar.gz -o /tmp/mediamtx.tar.gz
          curl -fsSL https://github.com/bluenviron/mediamtx/releases/download/v1.12.2/mediamtx_v1.12.2_linux_amd64.tar.gz.sha256sum -o /tmp/mediamtx.sha256
          cd /tmp
          EXPECTED=$(cut -d ' ' -f1 mediamtx.sha256)
          ACTUAL=$(sha256sum mediamtx.tar.gz | cut -d ' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          tar -xzf mediamtx.tar.gz mediamtx mediamtx.yml
          ./mediamtx mediamtx.yml > /tmp/smart24-rtsp-server.log 2>&1 &
          sleep 2
          ffmpeg -nostdin -re -f lavfi -i 'testsrc2=size=640x360:rate=10' -c:v libx264 -preset ultrafast -tune zerolatency -g 10 -pix_fmt yuv420p -rtsp_transport tcp -f rtsp rtsp://127.0.0.1:8554/testcam > /tmp/smart24-rtsp-source.log 2>&1 &
          sleep 2
      - name: Preparar câmeras com autenticação e falha de rede
        run: |
          python3 android-vision-pilot/scripts/camera-fixtures.py > /tmp/smart24-camera-fixtures.log 2>&1 &
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(10):
              try:
                  with urlopen('http://127.0.0.1:8080/stats', timeout=2) as response:
                      assert response.status == 200
                  break
              except Exception:
                  if attempt == 9:
                      raise
                  time.sleep(1)
          PY
      - name: Instalar e abrir o APK no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle -p android-vision-pilot :app:connectedDebugAndroidTest --stacktrace --console=plain
            adb pull /sdcard/Android/data/br.com.thiaguinhosolucoes.smart24vision/files/proof /tmp/smart24-ui-proof

      - name: Registrar respostas das câmeras de teste
        if: always()
        run: curl -fsS http://127.0.0.1:8080/stats -o /tmp/smart24-camera-fixtures-stats.json || true
      - name: Publicar relatório do teste Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-V3-Android-Smoke-API-${{ matrix.api }}
          path: |
            android-vision-pilot/app/build/reports/androidTests/
            android-vision-pilot/app/build/outputs/androidTest-results/
            /tmp/smart24-rtsp-server.log
            /tmp/smart24-rtsp-source.log
            /tmp/smart24-camera-fixtures.log
            /tmp/smart24-camera-fixtures-stats.json
            /tmp/smart24-ui-proof/
          if-no-files-found: ignore
