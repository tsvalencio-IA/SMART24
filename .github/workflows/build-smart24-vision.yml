name: Build SMART24 Vigilante Celular APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-vision-pilot/**'
      - '.github/workflows/build-smart24-vision.yml'

concurrency:
  group: smart24-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar, testar e verificar Android
        run: gradle -p android-vision-pilot :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-Vigilante-Celular-V3-APK
          path: android-vision-pilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar relatórios de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-V3-Validacao
          path: |
            android-vision-pilot/app/build/reports/tests/testDebugUnitTest/
            android-vision-pilot/app/build/test-results/testDebugUnitTest/
            android-vision-pilot/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e abrir o APK no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle -p android-vision-pilot :app:connectedDebugAndroidTest --stacktrace --console=plain
      - name: Publicar relatório do teste Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMART24-V3-Android-Smoke
          path: |
            android-vision-pilot/app/build/reports/androidTests/
            android-vision-pilot/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
